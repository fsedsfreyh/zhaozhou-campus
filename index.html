<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>昭州校园社区</title>
  <link rel="stylesheet" href="css/style.css?v=6">
  <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
  <script>
// ⚡ 内联路由器（缓存无关）
window.router = {
  _routes: {},
  register: function(p, h) { this._routes[p] = h; },
  navigate: function(h) { if (!h.startsWith('#')) h = '#' + h; history.replaceState(null, '', h); this._resolve(h); },
  start: function() { this._resolve(location.hash || '#/'); var self = this; window.addEventListener('hashchange', function() { self._resolve(location.hash); }); },
  _resolve: function(hash) {
    document.querySelectorAll('.page-container').forEach(function(e) { e.classList.remove('active'); });
    if (this._routes[hash]) { this._routes[hash]({}).catch(function(e) { console.error('Route error:', e.message); }); return; }
    for (var p in this._routes) {
      if (!p.includes(':')) continue;
      var ps = p.split('/'), hs = hash.split('/');
      if (ps.length !== hs.length) continue;
      var params = {}, match = true;
      for (var i = 0; i < ps.length; i++) {
        if (ps[i].startsWith(':')) { params[ps[i].slice(1)] = decodeURIComponent(hs[i]); }
        else if (ps[i] !== hs[i]) { match = false; break; }
      }
      if (match) { this._routes[p](params).catch(function(e) { console.error('Route error:', e.message); }); return; }
    }
    console.log('No route matched:', hash);
  }
};
  </script>
  <script src="js/supabase.js?v=6"></script>
  <script src="js/app.js?v=6" defer></script>
  <script src="js/posts.js?v=6" defer></script>
  <script src="js/comments.js?v=6" defer></script>
  <script src="js/auth.js?v=6" defer></script>
  <script src="js/admin.js?v=6" defer></script>
</head>
<body>
  <div id="app">
    <!-- 顶栏 -->
    <nav class="top-bar" id="topBar">
      <div class="nav-inner">
        <a href="#/" class="logo">🏨 昭州校园</a>
        <div class="nav-center" id="navCenter">
          <button class="nav-btn active" data-page="home">首页</button>
        </div>
        <div class="nav-right" id="navRight">
          <button class="nav-btn" id="loginBtn">登录</button>
          <div class="user-menu" id="userMenu" style="display:none">
            <button class="user-avatar-btn" id="userMenuBtn">
              <span id="userAvatarText">U</span>
            </button>
            <div class="dropdown" id="userDropdown">
              <a href="#/my-posts" class="dropdown-item">我的帖子</a>
              <a href="#/bookmarks" class="dropdown-item">我的收藏</a>
              <a href="#/profile" class="dropdown-item">个人设置</a>
              <a href="#/admin" class="dropdown-item" id="adminLink" style="display:none">管理后台</a>
              <div class="dropdown-divider"></div>
              <a href="#" class="dropdown-item" id="logoutBtn">退出登录</a>
            </div>
          </div>
        </div>
      </div>
    </nav>

    <!-- 主内容区 -->
    <main id="mainContent">
      <div class="loading-screen" id="loadingScreen">
        <div class="spinner"></div>
        <p>加载中...</p>
      </div>
      <!-- 页面容器（路由器控制显示） -->
      <div class="page-container" id="page-home"></div>
      <div class="page-container" id="page-board"></div>
      <div class="page-container" id="page-post"></div>
      <div class="page-container" id="page-login"></div>
      <div class="page-container" id="page-register"></div>
      <div class="page-container" id="page-profile"></div>
      <div class="page-container" id="page-admin"></div>
      <div class="page-container" id="page-create"></div>
      <div class="page-container" id="page-my-posts"></div>
      <div class="page-container" id="page-bookmarks"></div>
      <div class="page-container" id="page-search"></div>
    </main>

    <!-- 浮动按钮 -->
    <button class="fab" id="fabBtn" title="快速发布">
      <span class="fab-icon">✏</span>
    </button>

    <!-- Toast 容器 -->
    <div class="toast-container" id="toastContainer"></div>
  </div>

  <!-- 登录弹窗 -->
  <div class="modal-overlay" id="authModal" style="display:none">
    <div class="modal auth-modal">
      <button class="modal-close" id="authModalClose">✕</button>
      <div class="auth-header">
        <h2 id="authTitle">登录</h2>
        <p class="auth-subtitle">昭州中学·校内专属社区</p>
      </div>
      <form id="authForm">
        <div class="auth-tabs">
          <button type="button" class="auth-tab active" data-mode="login">登录</button>
          <button type="button" class="auth-tab" data-mode="register">注册</button>
        </div>
        <div class="form-group">
          <label>电子邮箱</label>
          <input type="email" id="authEmail" placeholder="your@email.com" required>
        </div>
        <div class="form-group">
          <label>密码</label>
          <input type="password" id="authPassword" placeholder="至少6位密码" minlength="6" required>
        </div>
        <div class="form-group" id="displayNameGroup" style="display:none">
          <label>显示名称</label>
          <input type="text" id="authDisplayName" placeholder="给自己取个名字吧">
          <small>你可以之后在个人设置中修改</small>
        </div>
        <button type="submit" class="btn btn-primary btn-block" id="authSubmit">登录</button>
        <p class="auth-error" id="authError"></p>
      </form>
    </div>
  </div>

  <!-- 帖子详情弹窗 -->
  <div class="modal-overlay" id="postModal" style="display:none">
    <div class="modal post-modal">
      <button class="modal-close" id="postModalClose">✕</button>
      <div id="postModalContent"></div>
    </div>
  </div>

  <!-- 搜索弹窗 -->
  <div class="modal-overlay search-overlay" id="searchModal" style="display:none">
    <div class="search-modal">
      <div class="search-bar">
        <span class="search-icon">🔍</span>
        <input type="text" id="searchInput" placeholder="搜索帖子..." autofocus>
        <button class="search-close" id="searchClose">✕</button>
      </div>
      <div class="search-results" id="searchResults"></div>
    </div>
  </div>
</body>
</html>
