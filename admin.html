<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>管理后台 - 昭州校园社区</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
  <link rel="stylesheet" href="css/style.css?v=18">
  <style>
    body { padding-top: 0; }
    .admin-layout { display: flex; min-height: 100vh; }
    .admin-sidebar { width: 200px; background: var(--glass-bg); backdrop-filter: blur(20px); border-right: 1px solid var(--glass-border); padding: 16px 0; flex-shrink: 0; }
    .admin-sidebar-title { padding: 0 16px 12px; font-weight: 700; font-size: 0.95rem; border-bottom: 1px solid var(--glass-border); margin-bottom: 8px; }
    .admin-nav-item { display: block; width: 100%; padding: 10px 16px; border: none; background: none; text-align: left; cursor: pointer; font-size: 0.85rem; color: var(--text-secondary); transition: all var(--transition); }
    .admin-nav-item:hover { background: var(--primary-light); color: var(--primary); }
    .admin-nav-item.active { background: var(--primary-light); color: var(--primary); font-weight: 600; }
    .admin-main { flex: 1; padding: 20px; overflow-y: auto; }
    .admin-section { display: none; }
    .admin-section.active { display: block; }
    .admin-stats-grid { display: grid; grid-template-columns: repeat(auto-fill,minmax(160px,1fr)); gap: 12px; margin-bottom: 20px; }
    .admin-stat-card { background: var(--glass-bg); backdrop-filter: blur(8px); border: 1px solid var(--glass-border); border-radius: var(--radius); padding: 16px; }
    .admin-stat-value { font-size: 1.6rem; font-weight: 700; color: var(--primary); }
    .admin-stat-label { font-size: 0.8rem; color: var(--text-light); margin-top: 4px; }
    .admin-input { padding: 8px 12px; border: 1px solid var(--glass-border); border-radius: 8px; font-size: 0.85rem; background: var(--glass-bg); color: var(--text); outline: none; width: 200px; }
    .admin-input:focus { border-color: var(--primary); }
    .admin-btn { padding: 6px 14px; border: none; border-radius: 6px; cursor: pointer; font-size: 0.82rem; transition: all var(--transition); }
    .admin-btn-primary { background: var(--primary); color: #fff; }
    .admin-btn-primary:hover { background: var(--primary-dark); }
    .admin-btn-danger { background: #ef4444; color: #fff; }
    .admin-btn-danger:hover { background: #dc2626; }
    .admin-btn-sm { padding: 4px 10px; font-size: 0.75rem; }
    @media (max-width: 767px) { .admin-sidebar { width: 56px; } .admin-sidebar-title { font-size: 0; padding: 0 8px 12px; } .admin-nav-item { padding: 8px; text-align: center; font-size: 0.7rem; } }
  </style>
</head>
<body>
  <div class="admin-layout">
    <nav class="admin-sidebar">
      <div class="admin-sidebar-title">🛠️ 管理后台</div>
      <button class="admin-nav-item active" onclick="switchTab('dashboard')">📊 概览</button>
      <button class="admin-nav-item" onclick="switchTab('posts')">📑 帖子</button>
      <button class="admin-nav-item" onclick="switchTab('reports')">🪄 举报</button>
      <button class="admin-nav-item" onclick="switchTab('banned')">🚫 违禁词</button>
      <button class="admin-nav-item" onclick="switchTab('announcements')">📢 公告</button>
      <hr style="border:none;border-top:1px solid var(--glass-border);margin:8px 12px">
      <button class="admin-nav-item" onclick="location.href='index.html'">← 返回</button>
    </nav>
    <main class="admin-main">
      <div class="admin-section active" id="section-dashboard">
        <h2 style="margin-bottom:16px">📊 数据概览</h2>
        <div class="admin-stats-grid" id="statsGrid">
          <div class="admin-stat-card"><div class="admin-stat-value" id="statPosts">-</div><div class="admin-stat-label">帖子</div></div>
          <div class="admin-stat-card"><div class="admin-stat-value" id="statComments">-</div><div class="admin-stat-label">评论</div></div>
          <div class="admin-stat-card"><div class="admin-stat-value" id="statUsers">-</div><div class="admin-stat-label">用户</div></div>
          <div class="admin-stat-card"><div class="admin-stat-value" id="statReports">-</div><div class="admin-stat-label">待处理举报</div></div>
        </div>
      </div>
      <div class="admin-section" id="section-posts">
        <h2 style="margin-bottom:12px">📑 帖子管理</h2>
        <div id="adminPostList"></div>
      </div>
      <div class="admin-section" id="section-reports">
        <h2 style="margin-bottom:12px">🪄 举报管理</h2>
        <div id="adminReportList"></div>
      </div>
      <div class="admin-section" id="section-banned">
        <h2 style="margin-bottom:12px">🚫 违禁词管理</h2>
        <div style="display:flex;gap:8px;margin-bottom:12px">
          <input class="admin-input" id="bannedWordInput" placeholder="添加违禁词" style="flex:1" onkeydown="if(event.key==='Enter')addBannedWord()">
          <button class="admin-btn admin-btn-primary" onclick="addBannedWord()">添加</button>
        </div>
        <div id="bannedWordList"></div>
      </div>
      <div class="admin-section" id="section-announcements">
        <h2 style="margin-bottom:12px">📢 公告管理</h2>
        <div style="margin-bottom:12px;display:flex;flex-direction:column;gap:8px">
          <input class="admin-input" id="announceTitle" placeholder="公告标题" style="width:100%">
          <textarea class="admin-input" id="announceContent" placeholder="公告内容" style="width:100%;min-height:80px;resize:vertical"></textarea>
          <button class="admin-btn admin-btn-primary" onclick="addAnnouncement()">发布公告</button>
        </div>
        <div id="announcementList"></div>
      </div>
    </main>
  </div>
  <script src="js/supabase.js?v=18"></script>
  <script src="js/utils.js?v=18"></script>
  <script src="js/modules.js?v=18"></script>
  <script src="js/admin.js?v=18"></script>
</body>
</html>
